# [pyth_feeds]). Verified live on hermes.pyth.network 2026-07-17 (PYUSD $1.0000,
# USDE $0.9998, USDS $0.9999, all <5s fresh) and each id === the asset's own
# pyth_feed_id (Crypto.{PYUSD,USDE,USDS}/USD).
"PYUSD/USD"   = "0xc1da1b73d7f01e7ddd54b3766cf7fcd644395ad14f70aa706ec5384c59e76692"
"USDE/USD"    = "0x6ec879b1e9963de5ee97e9c8710b742d6228252a5e2ca12d4ae81d7fe5ee8c5d"
"USDS/USD"    = "0x77f0971af11cc8bac224917275c1bf55f2319ed5c654a1ca955c82fa2d297ea1"

# ============================================================
# Polling cadences (env vars override these)
# ============================================================

[polling]
sanctum_poll_ms      = 15000   # batch call for all LSTs at once
jupiter_tick_ms      = 2500    # 0.4 RPS × concurrency=1 keeps us under the 0.5 RPS keyless budget; ~50s per asset across the ~19 jupiter-backed slots
hylo_onchain_poll_ms = 30000
piggybank_poll_ms    = 60000   # NAV only changes at 48h epoch boundaries
pyth_stream_reconnect_backoff_max_ms = 30000

# ============================================================
# Pyth staleness windows
# ============================================================
# Spot feeds (SOL/USD, USDC/USD, …) update at ~1 Hz, so the 30s default
# is right. Issuer-attested NAV / redemption-rate feeds only step at the
# underlying's settlement cadence (daily for USDY/SUSDE/SYRUPUSDC,
# weekly+ for ONyc). The previous global 30s window was rejecting these
# permanently, leaving USDY/SUSDE/SYRUPUSDC/ONyc stuck at state=UNKNOWN
# on the dashboard. 36h covers a daily-step feed plus weekend gaps.

[pyth_staleness]
default_secs = 30

[pyth_staleness.overrides]
# The override must target the daily-stepping INTRINSIC feed (`.RR` redemption
# rate), NOT the continuously-updating spot `USDY/USD` market feed. Keying the
# spot feed (the pre-fix bug) left the `.RR` intrinsic on the 30s default →
# stale >600s for ~23h/day after each daily Ondo push → USDY verdict frozen at
# UNKNOWN most of the day. Every sibling below correctly keys its `.RR`/`.NAV`.
"USDY/USD.RR"        = 129600   # 36h — daily Ondo NAV step (intrinsic redemption rate)
"SUSDE/USDE.RR"       = 129600   # 36h — daily Ethena redemption rate
"SYRUPUSDC/USDC.RR"   = 129600   # 36h — daily Maple redemption rate
"ONYC/USD.NAV"        = 604800   # 7d  — weekly Ondo NAV step
"EUSX/USX.RR" = 129600
"PST/USDC.RR" = 129600
