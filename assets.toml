# ⚠️ DEFERRED 2026-07-17 — the reactivation described below is SPLIT OUT and the
# entry is kept active=false. A backend launch-readiness audit found the INTRINSIC
# side has NO liveness gate: a frozen-but-served backing (dead pool / halted
# rewards) passes the 600s TIMESTAMP-only staleness (sanctum.rs re-stamps ts=now)
# as a confident false PEGGED — exactly the 2026-04-01 dSOL failure. And
# monitoring_only can no longer contain it (it became a beta LABEL, not an egress
# gate, on 2026-06-16 — dispatches alerts anyway). So dSOL stays deactivated until
# the intrinsic-liveness gate (backing-advancement / epoch-clock) ships; it is then
# reactivated WITH that gate protecting it. The rationale below is still valid on the
# merits (the pool is demonstrably alive) — it's the MISSING GATE, not dSOL's health,
# that defers it. See ADR (intrinsic-liveness) + docs/incident-2026-04-01-drift.md.
#
# dSOL reactivation (2026-07-15) — reverses the 2026-04-01 Drift-exploit
# deactivation from migration 0020 / docs/incident-2026-04-01-drift.md, which
# predicted reactivation was "almost certainly never" going to happen. Live
# verification today says otherwise:
#   - extra-api.sanctum.so/v1/lsts still lists this exact mint under a
#     SanctumSpl stake-pool (vote account DriFTm3wM9ugxhCA1K3wVQMSdC4Dv4LNmyZMmZiuHRpp,
#     Drift's own validator) — structurally separate infrastructure from the
#     perps/lending program that was reportedly exploited; native-stake LSTs
#     aren't drainable via a DEX-program admin-key compromise.
#   - lst-directory.com/api/directory shows $217.4M TVL, 4,469 holders,
#     flags {stale:false, dead:false, deprecated:false}, and — decisively —
#     a monotonically increasing exchange rate over the last 5 epochs
#     (1.203178 -> 1.204609), i.e. staking yield is actively accruing.
#     A frozen/rugged stake pool cannot produce that rate curve.
# This is a real reversal of a documented incident response, not a routine
# add — founder should confirm before this ships to production monitoring.
