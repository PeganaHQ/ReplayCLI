# Intrinsic: invert USD/EUR cross. Pyth publishes FX.EUR/USD; with invert=false we use it directly as EUR-per-USD.
# WEEKEND-DARK (FX feed): the EUR/USD intrinsic is a Pyth FX feed, and forex
# closes Fri ~21:00–22:00 → Sun ~21:00–22:00 UTC (DST-dependent: summer ~21:00,
# winter ~22:00). With the intrinsic absent the engine can't
# compute a discount, so it SKIPS the recompute (main.rs H8 path: no
# discount_snapshots row, pegana_engine_intrinsic_unavailable_total++). The
# published state does NOT flip to UNKNOWN — it FREEZES at its last value; the
# H12b sweep only *reports* it stale (observability), it does not change the
# verdict. Verified live 2026-06-14: rows ran Fri→21:10 UTC, Sat fully dark, Sun
# resumed ~21:00, last_state stayed PEGGED. Net for the promotion gate: exactly
# ONE UTC date per weekend (Saturday) loses all rows — Fri/Sun keep partial-day
# rows — so days_covered drops by ~1/weekend (NOT 2) and the 7-of-8 gate is
# usually still reachable (see scripts/calibration-monitor.sql FX caveat).
# SCOPE (verified live: EURC is monitoring_only=true since the Phase-0 launch —
# migration 0048, "zero calibration history"): the weekend freeze does NOT reach
# public alert egress (the former /v1/alerts feed excluded monitoring_only; /v1/audit now lists them) and no alert
# fires (state doesn't transition). EURC IS still DISPLAYED on the web (screener
# + asset-detail) with a MONITORING badge; during the dark window the asset-detail
# StaleBanner shows a calm "FX market closed — expected, not an outage" variant
# (web/lib/asset/forex.ts) instead of the alarming stale tone. Remaining nicety =
# weekend-aware staleness→UNKNOWN for FX intrinsics in the engine (post-06-25
# lock). No USD-pegged asset has this (feeds are 24/7 crypto).
intrinsic      = { kind = "pyth_fx_cross", feed = "EUR/USD", invert = false }
