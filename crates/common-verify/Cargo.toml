[package]
name        = "pegana-common-verify"
version     = "0.1.1"
edition     = "2021"
description = "Public, verifier-safe types shared between Pegana's methodology crate, replay CLI, and engine. Carve-out of pegana-common containing only what's needed to parse assets.toml and validate audit receipts — no server-side runtime types, no Redis channels, no webhook crypto, no Sentry init."
license     = "MIT"
repository  = "https://github.com/PeganaHQ/ReplayCLI"

[features]
# Enables tests that read files from the workspace root (e.g. ../../../assets.toml).
# Off by default so the published crate on crates.io is self-contained.
workspace-tests = []

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }
toml          = { workspace = true }
chrono        = { workspace = true }
uuid          = { workspace = true }
