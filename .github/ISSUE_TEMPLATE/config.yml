# This repo is the verifier subset of PeganaHQ/Pegana, mirrored automatically
# by a sync pull request. Work is planned on the upstream tracker, so blank
# issues are disabled and every route below points at a place that is read.
#
# The security link is deliberately first: a vulnerability in the verifier is
# the one report that must never sit unread in a public tracker.
#
# NOTE: this file lives under tools/pegana-replay-public/ in PeganaHQ/Pegana.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/PeganaHQ/ReplayCLI/security/advisories/new
    about: >-
      A bug that could let a tampered receipt verify as clean. Please use
      private reporting, never a public issue, before disclosure.

  - name: Bug report, question, or feedback
    url: https://github.com/PeganaHQ/Pegana/issues
    about: Open it on the upstream PeganaHQ/Pegana tracker, where work is planned.

  - name: Methodology change (requires an ADR)
    url: https://github.com/PeganaHQ/Pegana/issues
    about: >-
      methodology_version is embedded in every receipt, so changing the math
      silently would break replay for receipts produced under the old rules.
      Start the discussion first; see CONTRIBUTING.md.

  - name: Verify an alert yourself
    url: https://www.pegana.xyz/audit
    about: The live audit ledger. Every published receipt, replayable.
