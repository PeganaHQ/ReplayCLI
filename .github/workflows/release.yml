name: Release

# pegana-replay binary release pipeline (cargo-dist 0.30.0).
#
# Builds the two supported targets (x86_64-unknown-linux-gnu + aarch64-
# apple-darwin — Intel Mac and Windows are dropped, see Cargo.toml for
# the rationale), attests each binary via the GitHub-native Sigstore
# action (no key material — OIDC), uploads to a GitHub Release. Triggers
# on `v*` AND `methodology-v*` so the CLI always ships in lockstep with
# the methodology crate the CLI is coupled to (exit-3 version-mismatch
# check in main.rs — the published CLI version equals the methodology
# version it embeds).

on:
  push:
    tags:
      - "v*"
      - "methodology-v*"

# Least privilege: the workflow-level default is read-only and each job
# elevates only what it actually needs. Previously `contents: write` +
# `attestations: write` + `id-token: write` were granted at the TOP level,
# which handed the Sigstore signing identity and release-write to every job —
# including `plan`, which only reads. A compromised step in any job could then
# have signed an artifact or rewritten a release.
permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { submodules: recursive }

      - name: Install dist
        run: |
          # Download, VERIFY, then run. `curl | sh` executes whatever the
          # server returns — a compromised release asset would run arbitrary
          # code inside a job that holds the Sigstore signing identity. The
          # checksum pins the installer the same way the action SHAs pin the
          # actions.
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.30.0/cargo-dist-installer.sh \
            -o /tmp/cargo-dist-installer.sh
          echo "d7eafd08921e0537a8bbc8716cd07f181a97cd2d47fa67abaae2415f24fab8c9  /tmp/cargo-dist-installer.sh" \
            | shasum -a 256 -c -
          sh /tmp/cargo-dist-installer.sh

      - name: dist plan (gate)
        run: dist plan --output-format=json > plan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan
          path: plan.json

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          # x86_64-apple-darwin (Intel Mac) and x86_64-pc-windows-msvc
          # dropped from v0.1.0 — see Cargo.toml comment for rationale.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # OIDC — Sigstore signing, no key material
      attestations: write   # attest-build-provenance writes the bundle
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { submodules: recursive }

      # SHA-pinned like every other step. The previous `@1.90` form relied on
      # a moving branch, which is exactly the tj-actions/changed-files failure
      # mode: whoever controls that ref controls this release build, and this
      # job holds `id-token: write` (Sigstore signing). Pinning the ACTION does
      # not freeze the TOOLCHAIN — `toolchain:` is resolved at run time, so we
      # still get the latest 1.90.x patch release.
      # Required by the repo's sha_pinning_required Actions policy.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-30
        with:
          toolchain: "1.90"

      - name: Install dist
        shell: bash
        run: |
          # Download, VERIFY, then run. `curl | sh` executes whatever the
          # server returns — a compromised release asset would run arbitrary
          # code inside a job that holds the Sigstore signing identity. The
          # checksum pins the installer the same way the action SHAs pin the
          # actions.
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.30.0/cargo-dist-installer.sh \
            -o /tmp/cargo-dist-installer.sh
          echo "d7eafd08921e0537a8bbc8716cd07f181a97cd2d47fa67abaae2415f24fab8c9  /tmp/cargo-dist-installer.sh" \
            | shasum -a 256 -c -
          sh /tmp/cargo-dist-installer.sh

      - name: Build artifacts
        shell: bash
        run: dist build --target ${{ matrix.target }} --artifacts=local

      # Sigstore attestation — issues a signed provenance statement
      # binding the binary's sha256 to this workflow's OIDC identity
      # (github.com/PeganaHQ/ReplayCLI). install.sh later verifies
      # this via `gh attestation verify` (ADR-0008).
      - name: Sigstore attest binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            target/distrib/pegana-replay-*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/

  release:
    name: Publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh release create/upload — nothing else needs this
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: ./dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # `gh release upload` requires a pre-existing release; create it on
          # first run, fall back to clobber-upload when re-running a tag whose
          # release already exists. (The v0.1.0 release was hand-created, so
          # this job had never actually run until v0.2.0.)
          # Upload only the archives + checksums. cargo-dist leaves the
          # unpacked staging dir (pegana-replay-cli-<target>/) next to the
          # .tar.xz in target/distrib/, so a bare ./dist/* glob would try to
          # upload a directory and fail ("is a directory"). The two extension
          # globs don't overlap: *.tar.xz excludes *.tar.xz.sha256.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./dist/*.tar.xz ./dist/*.tar.xz.sha256 --clobber
          else
            gh release create "$TAG" ./dist/*.tar.xz ./dist/*.tar.xz.sha256 \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
